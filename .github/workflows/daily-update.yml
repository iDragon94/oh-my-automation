name: Daily Shadowrocket Update

# 每天 8:30（香港时间 UTC+8）拉取最新 lazy_group.conf 并执行修改脚本
# cron 用 UTC：8:30 HKT = 0:30 UTC
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:  # 允许手动触发，方便测试

permissions:
  contents: write  # 允许 workflow 提交回仓库

concurrency:
  group: daily-shadowrocket-update
  cancel-in-progress: false

jobs:
  fetch-and-modify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest lazy_group.conf
        run: |
          set -euo pipefail
          curl -fsSL \
            -o automation/shadowrocket/lazy_group.conf \
            https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/lazy_group.conf
          echo "Downloaded. Size: $(wc -c < automation/shadowrocket/lazy_group.conf) bytes"

      - name: Run modify script
        run: python3 automation/shadowrocket/modify.py

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/shadowrocket/lazy_group.conf
          if ! git diff --cached --quiet; then
            # 有变化：提交每日更新（本身就是 push 活动，重置 60 天计数）
            git commit -m "chore(shadowrocket): daily update $(date -u +%F)"
            git push
            echo "Pushed daily update."
          else
            # 无变化：检查距上次 commit 多少天
            # GitHub 会在仓库 60 天无 push/issue/PR 活动时禁用 scheduled workflows，
            # 超过 50 天时主动提交一次心跳，留 10 天缓冲应对 cron 延迟。
            LAST_COMMIT_DATE=$(git log -1 --format=%ct)
            NOW=$(date +%s)
            DAYS_SINCE=$(( (NOW - LAST_COMMIT_DATE) / 86400 ))
            echo "No content changes. Days since last commit: ${DAYS_SINCE}"
            if [ "${DAYS_SINCE}" -ge 50 ]; then
              date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.heartbeat
              git add .github/.heartbeat
              git commit -m "chore: heartbeat (keep scheduled workflows alive, ${DAYS_SINCE}d since last commit)"
              git push
              echo "Pushed heartbeat commit (${DAYS_SINCE} days since last commit)."
            else
              echo "Skipping heartbeat (only ${DAYS_SINCE}d since last commit, threshold=50)."
            fi
          fi
